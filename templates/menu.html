<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>LE Code Studio</title>

    <link rel="stylesheet" href="/static/css/menu.css">
</head>

<body>

    <main>
        <section class="hero">

            <!-- LOGO DECORATIVA -->
            <img src="/static/img/image.png" class="logo-bg fade-side delay-1" alt="Logo LE Code Studio">


            <!-- CONTEÚDO -->
            <div class="conteudo">
                <h1 class="fade-up delay-1">LE Code Studio</h1>
                <p class="fade-up delay-2">Desenvolvimento Web & Sistemas Sob Medida</p>

                <div class="botoes fade-up delay-3">
                    <button class="btn-orcamento" data-bs-toggle="modal" data-bs-target="#formOrcamento">
                        Solicitar Orçamento
                    </button>
                    <a href="/servicos.html">
                        <button class="btn-servicos">Ver Serviços</button>
                    </a>

                </div>
            </div>

            <form action="formulario_orcamento" method="post">
                <div class="modal fade" id="formOrcamento" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">

                            <div class="modal-body">
                                <div class="d-flex justify-content-center align-items-center mb-3">
                                    <h3>Solicitar Orçamento</h3>
                                </div>

                                <div class="mb-3">
                                    <label for="exampleFormControlInput1" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="exampleFormControlInput1"
                                        placeholder="Seu nome completo">
                                </div>

                                <div class="mb-3">
                                    <label for="exampleFormControlInput1" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="exampleFormControlInput1"
                                        placeholder="name@example.com">
                                </div>

                                <div class="mb-3">
                                    <label for="telefone" class="form-label">WhatsApp</label>
                                    <input type="tel" class="form-control telefone" id="telefone"
                                        placeholder="(00) 00000-0000" maxlength="15" data-mask="telefone"
                                        autocomplete="tel">
                                </div>

                                <div class="mb-3">
                                    <label for="exampleFormControlInput1" class="form-label">Tipo de Serviço</label>
                                    <select class="form-select" aria-label="Default select example">
                                        <option selected disabled>Selecione um tipo de serviço</option>
                                        <option value="1">Desenvolvimento Web</option>
                                        <option value="2">Aplicativos Mobile</option>
                                        <option value="3">Design UI/UX</option>
                                        <option value="4">Consultoria Técnica</option>
                                        <option value="5">Segurança</option>
                                        <option value="6">Análise de Dados</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="exampleFormControlTextarea1" class="form-label">Descrição do
                                        Sistema(Web)</label>
                                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="exampleFormControlInput1" class="form-label">Prazo de Entrega</label>
                                    <select class="form-select" aria-label="Default select example">
                                        <option selected disabled>Selecione um prazo de entrega</option>
                                        <option value="1">Urgente (até 7 dias)</option>
                                        <option value="2">Curto prazo (15–30 dias)</option>
                                        <option value="3">Médio prazo (30–60 dias)</option>
                                        <option value="4">Longo prazo (60+ dias)</option>
                                        <option value="5">Sem prazo definido</option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-primary">Enviar</button>

                            </div>

                        </div>
                    </div>
                </div>
            </form>


        </section>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/static/js/menu.js"></script>

</body>

</html>
